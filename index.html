
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>Ma3terMusic.rap</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:35px 15px;background:linear-gradient(140deg,#300008,#111);border-bottom:2px solid #ff1020}
h1{font-size:clamp(27px,7vw,45px);margin:0}
h1 span{color:#ff1020}
header p{color:#bbb}
main{max-width:750px;margin:auto;padding:18px}
.panel{background:#17171f;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px}
h2{font-size:20px}
.track{padding:14px;background:#0e0e14;border:1px solid #333;border-radius:12px;margin:12px 0}
.track strong{display:block;margin-bottom:10px;overflow-wrap:anywhere}
audio{width:100%;height:42px}
input,button{font:inherit;border-radius:9px;padding:12px}
input{width:100%;margin:7px 0;background:#0c0c12;color:white;border:1px solid #444}
button{background:#ff1020;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.small{font-size:13px;color:#bbb;line-height:1.9}
footer{text-align:center;padding:25px;color:#888;font-size:12px}
</style>
</head>
<body>
<header>
<h1>Ma3ter<span>Music</span>.rap 🎤</h1>
<p>رپ از Ma3ter | گوش بده، حال کن 🔥</p>
</header>
<main>
<section class="panel">
<h2>🎧 ترک‌های منتشرشده</h2>
<div id="tracks"><p class="small">هنوز ترکی اضافه نشده.</p></div>
</section>

<section class="panel">
<h2>🔐 پنل مدیر</h2>
<p class="small">این نسخه فقط برای آزمایش روی همین دستگاه است؛ ورود مدیر و ذخیره‌سازی آنلاین هنوز راه‌اندازی نشده‌اند.</p>
<input id="title" placeholder="اسم ترک">
<input id="audio" type="file" accept="audio/*">
<button id="add">افزودن ترک آزمایشی</button>
<p id="msg" class="small"></p>
</section>
</main>
<footer>Ma3terMusic.rap · ساخته‌شده برای Ma3ter 🎙️</footer>
<script>
const title=document.getElementById('title');
const audio=document.getElementById('audio');
const tracks=document.getElementById('tracks');
const msg=document.getElementById('msg');

document.getElementById('add').onclick=()=>{
 const name=title.value.trim();
 const file=audio.files[0];
 if(!name||!file){msg.textContent='اسم ترک و فایل صوتی را وارد کن.';return}
 if(!file.type.startsWith('audio/')){msg.textContent='فقط فایل صوتی انتخاب کن.';return}
 if(file.size>50*1024*1024){msg.textContent='حجم فایل باید کمتر از ۵۰ مگابایت باشد.';return}
 if(tracks.querySelector('.empty'))tracks.innerHTML='';
 if(tracks.textContent.includes('هنوز ترکی اضافه نشده'))tracks.innerHTML='';
 const card=document.createElement('div');
 card.className='track';
 const label=document.createElement('strong');
 label.textContent=name;
 const player=document.createElement('audio');
 player.controls=true;
 player.src=URL.createObjectURL(file);
 card.append(label,player);
 tracks.prepend(card);
 title.value='';
 audio.value='';
 msg.textContent='ترک آزمایشی اضافه شد؛ فعلاً فقط در همین صفحه در دسترس است.';
};
</script>
</body>
</html>
